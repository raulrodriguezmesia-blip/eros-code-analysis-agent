[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short

[coverage:run]
source = .
omit = 
    app/*.py
    docs/**
    .github/**
    .venv/**
    __pycache__/**
    *.pyc
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
fail_under = 50