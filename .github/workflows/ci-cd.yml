name: EROS CI/CD Pipeline — Desafío de Ingeniería de Frontera 2026

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests with coverage
        run: |
          pytest test_agent.py -v --cov=app --cov-report=xml --cov-fail-under=80
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'
          
      - name: Install security scanner
        run: |
          pip install bandit safety
          
      - name: Bandit security scan
        run: |
          bandit -r app/ -f json -o bandit-results.json || true
          
      - name: Safety dependency check
        run: |
          safety check -r requirements.txt -f json -o safety-results.json || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Docker image
        run: |
          docker build -t eros-code-analysis:${{ github.sha }} .
          
      - name: Run demo verification
        run: |
          python run_simulation.py
          python test_agent.py --export-sarif

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security-scan, build-and-push]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Azure — Desafío de Ingeniería de Frontera 2026
        run: |
          echo "Deploying EROS Code Analysis Agent — Desafío de Ingeniería de Frontera 2026..."
          # Deployment steps would go here
          echo "Deployment completed successfully"