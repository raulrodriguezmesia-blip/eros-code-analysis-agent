name: eros-code-analysis
description: Multi-agent reasoning system with Microsoft Foundry IQ - Code analysis + IT Support
template:
  kind: hosted
  protocols:
    - type: responses
      version: v1
  environment_variables:
    - MODEL_DEPLOYMENT
    - PROJECT_ENDPOINT
    - FOUNDRY_TOOLBOX_ENDPOINT
    - FOUNDRY_IQ_ENDPOINT

variants:
  - name: code-analysis
    description: 5-phase code review pipeline
    entrypoint: app.main:analyze_code_multi_step
  - name: it-support
    description: 4-phase IT incident resolution
    entrypoint: app.hybrid_agent:it_support_reasoning
  - name: hybrid
    description: Auto-routing multi-agent
    entrypoint: app.hybrid_agent:hybrid_agent